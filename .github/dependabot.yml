# Monthly dependency updates. Each package family gets two grouped PRs:
# minor/patch updates, which should pass CI as-is, and major updates, which
# usually need code changes and are upgraded deliberately. Security updates
# are raised separately by Dependabot as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      astro:
        update-types: [minor, patch]
        patterns:
          - astro
          - '@astrojs/*'
          - prettier-plugin-astro
      astro-major:
        update-types: [major]
        patterns:
          - astro
          - '@astrojs/*'
          - prettier-plugin-astro
      eslint:
        update-types: [minor, patch]
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-*
          - typescript-eslint
          - globals
      eslint-major:
        update-types: [major]
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-*
          - typescript-eslint
          - globals
      react:
        update-types: [minor, patch]
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      react-major:
        update-types: [major]
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
