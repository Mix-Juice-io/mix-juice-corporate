# Monthly dependency updates. Each package family gets two grouped PRs:
# minor/patch updates, which should pass CI as-is, and major updates, which
# usually need code changes and are upgraded deliberately. Security updates
# are raised separately by Dependabot as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    ignore:
      # @types/node must match the Node major in .node-version (the runtime
      # in CI and Cloudflare Pages). Bump it together with .node-version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # ESLint 10 cannot be installed until eslint-plugin-jsx-a11y is replaced
      # (its eslint peer stops at ^9), and eslint-plugin-astro >=2 requires
      # ESLint 10. Remove both entries when migrating: see issue #144.
      - dependency-name: eslint
        versions: ['>=10']
      - dependency-name: eslint-plugin-astro
        versions: ['>=2']
    groups:
      astro:
        update-types: [minor, patch]
        patterns:
          - astro
          - '@astrojs/*'
          - prettier-plugin-astro
      astro-major:
        update-types: [major]
        patterns:
          - astro
          - '@astrojs/*'
          - prettier-plugin-astro
      # typescript is grouped with typescript-eslint because typescript-eslint
      # caps its supported TypeScript range (e.g. <6.1.0), so a TypeScript
      # minor bump on its own can break lint installs.
      eslint:
        update-types: [minor, patch]
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-*
          - typescript-eslint
          - typescript
          - globals
      eslint-major:
        update-types: [major]
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-*
          - typescript-eslint
          - typescript
          - globals
      react:
        update-types: [minor, patch]
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      react-major:
        update-types: [major]
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
